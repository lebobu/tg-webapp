<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Service</title>

  <link rel="stylesheet" href="style.css?v=20260519-1">

  <!-- Основной скрипт WebApp -->
  <!-- <script defer src="script.js"></script> -->
</head>

<body>
  <div class="price-and-cart">
      <!-- Значок Помощь -->
    <button class="bt-help" type="button" aria-label="Помощь">❓</button>
  </div>

  <!-- Шаг 1 -->
  <div class="step step-1">
    <p><strong>Шаг 1/3: Выберите подписку</strong></p>
    <div class="buttons">
      <button type="button" class="btn option" data-plan="EU">Я в России (хочу youtube)</button>
      <button type="button" class="btn option" data-plan="RU">Я за границей (хочу госуслуги)</button>
    </div>
  </div>

  <!-- Шаг 2 -->
  <div class="step step-2" style="display:none">
    <p><strong>Шаг 2/3: Настройка аккаунтов и срока</strong></p>

    <div class="choice-card">
      <div class="choice-card__title">Аккаунты</div>
      <div class="buttons">
        <button type="button" class="btn option" data-accounts="1">1 аккаунт</button>
        <button type="button" class="btn option" data-accounts="3">3 аккаунта</button>
        <button type="button" class="btn option" data-plan="Роутер">Для роутера</button>
      </div>
    </div>

    <div class="choice-card">
      <div class="choice-card__title">Срок</div>
      <div class="buttons">
        <button type="button" class="btn option" data-duration="1">1 месяц</button>
        <button type="button" class="btn option" data-duration="3">3 месяца</button>
        <button type="button" class="btn option" data-duration="6">6 месяцев</button>
      </div>
    </div>
  </div>

  <!-- Шаг 3 -->
<div class="step step-3" style="display:none">
  <p><strong>Шаг 3/4: Подтверждение</strong></p>

  <div class="confirm-box">
    <div id="summary"></div>

    <!-- Email -->
    <div class="field" id="email-field" style="margin-top:12px">
      <label for="email" class="email-label" style="display:block; font-weight:600; margin-bottom:6px;">
        Заполните (проверьте) ваш адрес эл.почты
      </label>
      <input id="email" class="email" type="email" inputmode="email" autocomplete="email"
             placeholder="you@example.com" required>
      <small id="email-error" style="display:none; color:#f3fc03; margin-top:6px;">Введите корректный email</small>
    </div>

    <!-- ОС устройства -->
    <div class="field" id="os-field" style="margin-top:18px">
      <label style="display:block; font-weight:600; margin-bottom:10px;">Ваша операционная система</label>
      <div class="buttons" style="margin-bottom:0">
        <button type="button" class="btn os-btn" data-os="apple">🍎 Apple (iOS / macOS)</button>
        <button type="button" class="btn os-btn" data-os="android">🤖 Android</button>
        <button type="button" class="btn os-btn" data-os="windows">🪟 Windows</button>
      </div>
      <small id="os-error" style="display:none; color:#f3fc03; margin-top:6px;">Выберите операционную систему</small>
    </div>
  </div>
</div>

  <!-- Шаг 4 -->
<div class="step step-4" style="display:none">
  <div class="confirm-box" id="receipt-box">
    <!-- заполняется из wizard.js -->
  </div>
</div>

  <!-- Прогресс-бар -->
  <div class="progress">
    <div class="progress-bar" id="progress-bar" style="width: 33%"></div>
  </div>

  <!-- Кнопки управления -->
  <div class="buttons nav-buttons">
    <button type="button" class="btn" id="back">Назад</button>
    <button type="button" class="btn full" id="next">Далее</button>
    <a href="/" class="btn full" id="ok-btn" style="display:none;background:#2563eb;border-color:#3b82f6">OK</a>
  </div>

  <!-- 🔧 Ручная матрица ИТОГОВЫХ цен -->
  <script>
    // Итоговые цены БЕЗ скидок/формул.
    // EU/RU: matrixTotals[plan][accounts][duration] = TOTAL
    // Роутер/Сервер VPS: matrixTotals[plan].durations[duration] = TOTAL
    window.PRICING = {
      currency: "₽",
      display: { currencyPosition: "suffix", thousandSep: " ", decimalSep: ",", fractionDigits: 0 },
      matrixTotals: {
        "EU": {
          "1": { "1": 120, "3": 330, "6": 650 },
          "3": { "1": 330, "3": 950, "6": 1700 }
        },
        "RU": {
          "1": { "1": 100, "3": 280, "6": 550 },
          "3": { "1": 280, "3": 800, "6": 1500 }
        },
        "Роутер": { durations: { "1": 450, "3": 1200, "6": 1800 } },
        // "Сервер VPS": { durations: { "1": 500, "3": 1400, "6": 2200 } }
      }
    };
  </script>

<!-- Help modal -->
<div id="help-modal" class="modal" aria-hidden="true">
  <div class="modal__dialog modal__dialog--help" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <button class="modal__close" type="button" aria-label="Закрыть" data-close>&times;</button>
    <h3 id="help-title" class="modal__title">Справка</h3>
    <iframe class="help-frame" src="help.html?v=20260519-1" title="Справка"></iframe>
  </div>
</div>

<!-- ваш скрипт -->
<script defer src="wizard.js?v=20260519-1"></script>

</body>

</html>
